<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Space Grotesk Variable';
    src: url('../../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2') format('woff2');
    font-weight: 300 700;
  }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  /* Mismo color de fondo que la app (--bg-base). Sin degradados a pantalla completa:
     comprimen muy mal en PNG (~500 KB por imagen) y en un splash de medio segundo no se notan. */
  body {
    background-color: #08090d;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk Variable', sans-serif;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 4vmin; transform: translateY(-3vh); }
  .logo {
    width: 30vmin; height: 30vmin; border-radius: 22%;
    box-shadow: 0 0 9vmin rgba(225, 29, 72, 0.35);
  }
  .name { color: #f8fafc; font-weight: 700; letter-spacing: 0.08em; font-size: 6vmin; }
  .name b { color: #e11d48; font-weight: 700; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="../../public/web-app-manifest-512x512.png" alt="">
    <div class="name">TELESCREEN <b>CCTV</b></div>
  </div>
</body>
</html>
